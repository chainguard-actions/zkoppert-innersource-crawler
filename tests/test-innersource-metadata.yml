name: Test InnerSource metadata in output
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run InnerSource Crawler
        uses: .
        env:
          GH_TOKEN: ${{ github.token }}
          ORGANIZATION: github
          TOPIC: open-source

      - name: Assert repos.json exists and has InnerSource metadata structure
        run: |
          echo "Checking repos.json structure..."
          if [ ! -f "repos.json" ]; then
            echo "FAIL: repos.json was not created"
            exit 1
          fi
          python3 -c "
          import json, sys
          data = json.load(open('repos.json'))
          print('Total repos found:', len(data))
          if len(data) == 0:
              print('INFO: no repos found for topic, skipping metadata check')
              sys.exit(0)
          errors = []
          for i, repo in enumerate(data[:5]):  # check first 5 repos
              if '_InnerSourceMetadata' not in repo:
                  errors.append('repo[{}] missing _InnerSourceMetadata'.format(i))
                  continue
              meta = repo['_InnerSourceMetadata']
              if 'participation' not in meta:
                  errors.append('repo[{}] _InnerSourceMetadata missing participation'.format(i))
              if 'topics' not in meta:
                  errors.append('repo[{}] _InnerSourceMetadata missing topics'.format(i))
              if 'score' not in repo:
                  errors.append('repo[{}] missing score'.format(i))
          if errors:
              print('FAIL:', errors)
              sys.exit(1)
          print('PASS: all checked repos have valid _InnerSourceMetadata structure')
          "
