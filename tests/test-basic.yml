name: Test basic usage - single topic
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run InnerSource Crawler
        uses: .
        env:
          GH_TOKEN: ${{ github.token }}
          ORGANIZATION: github
          TOPIC: open-source

      - name: Assert repos.json was created
        run: |
          echo "Checking for repos.json..."
          if [ ! -f "repos.json" ]; then
            echo "FAIL: repos.json was not created"
            exit 1
          fi
          echo "PASS: repos.json exists"

      - name: Assert repos.json is valid JSON
        run: |
          echo "Validating repos.json content..."
          if ! python3 -c "import json, sys; data=json.load(open('repos.json')); print('Parsed', len(data), 'repos')" 2>&1; then
            echo "FAIL: repos.json is not valid JSON"
            exit 1
          fi
          echo "PASS: repos.json is valid JSON"

      - name: Assert repos.json is a JSON array
        run: |
          TYPE=$(python3 -c "import json; data=json.load(open('repos.json')); print(type(data).__name__)")
          echo "actual type: $TYPE"
          if [ "$TYPE" != "list" ]; then
            echo "FAIL: expected repos.json to be a JSON array (list), got: $TYPE"
            exit 1
          fi
          echo "PASS: repos.json is a JSON array"
