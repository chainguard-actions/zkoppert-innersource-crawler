name: Test missing TOPIC env var causes failure
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run InnerSource Crawler without TOPIC (expect failure)
        id: crawler
        uses: .
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ORGANIZATION: github
          # TOPIC intentionally omitted to trigger ValueError

      - name: Assert crawler failed when TOPIC is missing
        env:
          OUTCOME: ${{ steps.crawler.outcome }}
        run: |
          echo "actual outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected crawler to fail when TOPIC is not set, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: crawler correctly failed when TOPIC env var was not set"
